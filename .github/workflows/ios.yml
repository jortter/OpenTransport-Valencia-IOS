name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "app/src/main/assets/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  # Queue instead of cancelling: every pushed step gets built and checked.
  cancel-in-progress: false

env:
  BUNDLE_ID: com.jortter.opentransport

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Core tests
        run: swift test --package-path ios/Packages/OpenTransportCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/OpenTransport.xcodeproj -scheme OpenTransport \
            -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Simulator screenshots
        run: |
          set -x
          mkdir -p ci-shots
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          phones = [d for d in devices if d["name"].startswith("iPhone 16 Pro")] or [d for d in devices if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Release-iphonesimulator/OpenTransport.app
          xcrun simctl privacy "$UDID" grant location "$BUNDLE_ID" || true
          xcrun simctl location "$UDID" set 39.4699,-0.3763 || true
          shot() {
            name=$1; shift
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -onboarded YES "$@"
            sleep ${WAIT:-20}
            xcrun simctl io "$UDID" screenshot "ci-shots/$name.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          }
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -onboarded NO
          sleep 8
          xcrun simctl io "$UDID" screenshot "ci-shots/0-onboarding.png"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          shot 1-map -initialTab map
          shot 2-stop -initialTab map -demoStop 7
          shot 3-line -initialTab map -demoLine 19
          shot 4-metro -initialTab map -demoPlace mt-20
          shot 5-bikes -initialTab map -demoPlace vb-1
          shot 6-rodalies -initialTab map -demoPlace rd-3000000
          shot 7-alerts -initialTab alerts
          shot 8-settings -initialTab settings -language es
          shot 9-plan -initialTab plan
          WAIT=90 shot 10-plan-result -initialTab plan -demoPlan 7,686
          # Crash reports, if the app died during any shot.
          cp ~/Library/Logs/DiagnosticReports/OpenTransport*.ips ci-shots/ 2>/dev/null || true
          for f in ci-shots/*.ips; do [ -f "$f" ] && { echo "::warning::crash report $f"; head -c 6000 "$f"; }; done
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "OpenTransport"' --style compact > ci-shots/app.log 2>&1 || true

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/OpenTransport.xcodeproj -scheme OpenTransport -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/OpenTransport.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../OpenTransport.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTransport-ipa
          path: build/OpenTransport.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ci-shots

      # Latest IPA as a pre-release, easy to open from the iPhone and install with SideStore.
      # The release is kept and only its asset replaced (deleting and recreating it
      # was refused once with a 403); a publishing hiccup must not fail a good build.
      - name: Publish pre-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build sin firmar de ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Instálalo con SideStore."
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest build/OpenTransport.ipa --clobber
            gh release edit ios-latest --notes "$notes"
          else
            gh release create ios-latest build/OpenTransport.ipa \
              --prerelease --target "$GITHUB_SHA" --title "iOS (último build)" --notes "$notes"
          fi

      # The same IPA on a one-commit branch: a fixed raw link that works even when
      # GitHub refuses the workflow token on the releases API (403 since 23 Oct).
      - name: Push IPA branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/branch && cd build/branch
          cp ../OpenTransport.ipa .
          printf 'Build sin firmar de %s @ %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > README.md
          git init -q -b ios-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "IPA for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-build

      # Screenshots on a separate branch so they can be reviewed without downloading artifacts.
      - name: Push screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d ci-shots ] || exit 0
          cd ci-shots
          printf '# Capturas del simulador\n\n%s @ %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > README.md
          for f in *.png; do printf '\n![%s](%s)\n' "$f" "$f" >> README.md; done
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

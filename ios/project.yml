# Xcode project definition. Generate with: cd ios && xcodegen generate
name: OpenTransport
options:
  bundleIdPrefix: com.jortter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.10.0"
  OpenTransportCore:
    path: Packages/OpenTransportCore
targets:
  OpenTransport:
    type: application
    platform: iOS
    sources:
      - path: OpenTransport
      # Static data is shared with the Android app (single source of truth).
      - path: ../app/src/main/assets
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - package: OpenTransportCore
    info:
      path: OpenTransport/Info.plist
      properties:
        CFBundleDisplayName: OpenTransport
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Para mostrar tu posición y las paradas cercanas en el mapa."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jortter.opentransport
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  OpenTransport:
    build:
      targets:
        OpenTransport: all
